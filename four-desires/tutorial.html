<!doctype html>
<html lang="zh-CN">
  <head>
    <base href="./tutorial-build/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090d12" />
    <link rel="icon" href="data:," />
    <title>断联者</title>
    <script type="module" crossorigin src="./assets/tutorial-DM0EaP8o.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/room-D4d4OenY.js">
    <link rel="modulepreload" crossorigin href="./assets/audio-CKj5NxwH.js">
    <link rel="modulepreload" crossorigin href="./assets/timeline-Bo6vyHkb.js">
    <link rel="modulepreload" crossorigin href="./assets/camera-motion-CQLidtVT.js">
    <link rel="stylesheet" crossorigin href="./assets/tutorial-38wPKBBq.css">
  </head>
  <body class="title-screen">
    <div id="backdrop">
      <div id="near-plane"><img id="near-image" alt="" /></div>
      <div id="far-plane"><img id="far-image" alt="" /></div>
    </div>
    <main id="game" aria-label="游戏场景"></main>
    <div id="loading">载入中…</div>
    <section id="arrival" aria-label="主菜单">
      <h1>断联者</h1>
      <div class="menu-rule"></div>
      <button id="start">开始游戏</button><button id="settings">设置</button>
      <div id="settings-menu" hidden>
        <button id="sound" aria-label="切换声音">声音　开</button
        ><button id="close-settings">返回</button>
      </div>
    </section>
    <section id="hud" hidden aria-label="角色状态">
      <canvas
        id="portrait"
        width="58"
        height="72"
        aria-label="主角头像"
      ></canvas>
      <div id="vitals">
        <div class="stat">
          <span>生命</span>
          <div
            id="health"
            class="meter"
            role="progressbar"
            aria-label="生命"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <i></i>
          </div>
        </div>
        <div class="stat">
          <span>痛苦</span>
          <div
            id="pain"
            class="meter"
            role="progressbar"
            aria-label="痛苦"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <i></i>
          </div>
        </div>
        <div class="stat">
          <span>愤怒</span>
          <div
            id="anger"
            class="meter"
            role="progressbar"
            aria-label="愤怒"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <i></i>
          </div>
        </div>
      </div>
      <div id="location"></div>
      <div id="resources" hidden></div>
    </section>
    <div id="speech" hidden>
      <button id="speech-next" aria-label="继续对白">
        <span id="speaker"></span><span id="speech-text"></span
        ><small>空格 ▸</small></button
      ><i></i>
    </div>
    <div id="ambient" aria-live="off"></div>
    <section id="notice" hidden role="status" aria-label="操作提示">
      <div id="notice-instruction">
        <div id="objective"></div>
        <div id="hint"></div>
      </div>
      <div id="toast" hidden></div>
      <button id="interaction" hidden></button>
    </section>
    <aside id="workshop" hidden aria-label="升级工作台">
      <h2>工作台</h2>
      <p id="supplies"></p>
      <nav>
        <button data-tab="body">身体</button
        ><button data-tab="wall">板材</button
        ><button data-tab="attack">普攻</button
        ><button data-tab="skills">技能</button>
      </nav>
      <div id="workshop-items"></div>
      <button id="close-workshop">返回 · Esc</button>
    </aside>
    <section id="pause-menu" hidden aria-label="暂停菜单">
      <h2>暂停</h2>
      <button id="continue">继续游戏</button
      ><button id="title">返回标题</button>
    </section>
    <div id="corner" hidden>
      <button id="help">操作提示</button
      ><button id="pause" aria-label="暂停游戏">暂停</button>
    </div>
  </body>
</html>
